{% comment %}
  PDF.js viewer include
  Usage:
    {% include pdfjs-viewer.html pdf_url=pdf_path %}
{% endcomment %}

{% if include.pdf_url %}
  <iframe
    src="{{ '/assets/pdfjs/web/viewer.html?file=' | append: include.pdf_url | relative_url | uri_escape }}"
    width="100%"
    height="800px"
    style="border:none;">
  </iframe>
{% else %}
  <p><em>No PDF available for this item.</em></p>
{% endif %}
